<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Image Gallery</h1>
  <nav class="filters" aria-label="Filter images">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="nature">Nature</button>
    <button class="chip" data-filter="city">City</button>
    <button class="chip" data-filter="abstract">Abstract</button>
  </nav>
</header>

<main>
  <p class="count" id="count" aria-live="polite"></p>
  <section class="grid" id="grid"></section>
</main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button class="lb-btn close" id="close" aria-label="Close">&times;</button>
  <button class="lb-btn prev" id="prev" aria-label="Previous image">&#10094;</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption><span id="lb-title"></span><span id="lb-count"></span></figcaption>
  </figure>
  <button class="lb-btn next" id="next" aria-label="Next image">&#10095;</button>
</div>
<script src="script.js"></script>
</body>
</html>
